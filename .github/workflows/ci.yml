name: Repository checks
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality-checks:
    name: Formatting and source analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source analysis tools
        run: python -m pip install black==23.12.1 isort==5.13.2 flake8==6.1.0 bandit==1.9.4
      - run: python -m black --check src tests tools
      - run: python -m isort --check-only src tests tools
      - run: python -m flake8 src tests tools --select=E9,F63,F7,F82 --show-source --statistics
      - name: Check source with Bandit
        run: python -m bandit -r src -f json -o bandit-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-analysis
          path: bandit-report.json
  dependencies:
    name: Locked runtime dependencies (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pip-audit poetry==2.1.4
      - run: poetry check --lock
      - run: python tools/export_locked_requirements.py > requirements-audit.txt
      - run: python -m pip_audit --disable-pip --no-deps -r requirements-audit.txt --format json --output dependency-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: locked-dependency-analysis-${{ matrix.python }}
          path: dependency-report.json
  offline-contracts:
    name: Offline contracts (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-offline.txt
      - run: python tools/verify_experiment_evidence.py
      - run: python -m unittest discover -s tests/offline -v
